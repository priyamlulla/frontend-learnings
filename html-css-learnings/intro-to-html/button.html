<!DOCTYPE html>

<html>
    <head>
        <title>Buttons</title>
        <style> 
    .subscribe-button {
        background-color:rgb(167, 22, 22);
        color: white;
        border: none;
        border-radius: 2px;
        cursor: pointer;
        margin-right: 8px;
        transition:opacity 0.1s;
        padding-top: 10px;
        padding-bottom: 10px;
        padding-left: 16px;
        padding-right: 16px;
    }

    .subscribe-button:hover{
        opacity: 0.7;
    }

    .subscribe-button:active{
        opacity: 0.4;
    }

    .join-button {
        background-color: white;
        color: blue;
        border-style: solid;
        border-color: blue;
        border-width: 1px;
        border-radius: 2px;
        cursor: pointer;
        transition: background-color 0.15s, 
            color 0.15s;
        padding-top: 9px;
        padding-bottom: 9px;
        padding-left: 16px;
        padding-right: 16px;
    }

    .join-button:hover{
        background-color: blue;
        color: white;
    }

    .join-button:active{
        opacity: 0.5;
    }

    .tweet-button{
        background-color: rgb(37, 91, 240);
        color:white;
        border-radius: 18px;
        height:36px;
        width:76px;
        border: none;
        cursor: pointer;
        font-weight: bold;
        font-size: 15px;
         margin-right: 8px;
         transition: box-shadow 0.15s;
    }

    .tweet-button:hover{
        box-shadow: 5px 10px 10px rgba(0,0,0,0.15);
    }
</style>
    </head>

    <body>
        <button class="subscribe-button"> 
            SUBSCRIBE 
        </button>  

        <button class="tweet-button"> 
            TWEET 
        </button>  

        <button class="join-button">  
            JOIN
        </button>    
    </body>
</html>
