<!DOCTYPE html>

<html>
    <head>
        <title>
            nested flex box practice
        </title>

        <style>
            
            .profile-icon{
                width: 45px;
                height: 45px;
                border-radius: 25px;
            }

            .name-date{
                display: flex;
                flex-direction: row;
                justify-content: space-between;
            }

            .box{
                border-width: 1px;
                box-shadow: 2px 2px 10px rgba(0,0,0,0.15);
                border: none;
                width: 350px;
                border-radius: 6px;
                padding-left: 20px;
                padding-bottom: 20px;
                padding-top: 10px;
            }

            .name{
                font-size: 18px;
                font-weight: bold;
            }

            .subject{
                font-size: 15px;
                font-weight: bold;
            }

            .message{
                font-size: 14px;
                color: gray;
            }

            .date{
                font-size: 12px;
                color: gray;
            }

            .header{
                font-size: 12px;
                color: grey;
                margin-bottom: 15px;
            }
        </style>
    </head>

    <body>
        <div class = "box">
            <div class ="header">
                ALL INBOXES
            </div>

            <div>
                <div style = "display: inline-block;">
                    <img src = "../thumbnails/cat-1045782_640.jpg" class = "profile-icon">
                </div>
                <div style = "display: inline-block;">
                    <div class = "name-date">
                        <div class ="name">Chewy Promotion</div>
                        <div class = "date">4:58 PM</div>
                    </div>
                    <div class = "subject">Biggest sale of the year</div>
                    <div class = "message"> Hey there we are writing to tell you about our ...</div>
                </div>
            </div>
        </div>
    </body>
</html>
