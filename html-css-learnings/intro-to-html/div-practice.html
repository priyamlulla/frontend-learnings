<!DOCTYPE html>

<html>
    <head>
        <style>

            p{
                font-family:Arial;
            }
            div{
                margin-top: 10px;
                margin-left: 10px;
                display: inline-block;
                width: 150px;
                border-width: 3px;
                box-shadow: 1px 2px 10px rgba(0,0,0,0.15);
            }
            img{
                
                width: 150px;
                height: 186px;
                object-fit: cover;
                object-position: center;
                margin-bottom: 0px;
            }

            .name{
                font-weight: bold;
                padding-left: 4.5px;
                margin-top: 6px;
                margin-bottom: 0px;
            }

            .mutual-friends{
                padding-left:4.5px;
                font-size: 14.5px;
                margin-top : 6px;
                color: rgb(102, 100, 100);
                margin-bottom: 0px;
            }

            .button{
                background-color: rgb(85, 85, 219);
                color:white;
                margin-left:6px;
                border:none;
                border-radius: 3px;
                margin-top: 9px;
                margin-bottom:10px;
                width: 100px;
                padding-top: 5px;
                padding-bottom: 5px;
            }
        </style>
    </head>

    <body>
        <div>
            <img src="../thumbnails/cat-1045782_640.jpg">

            <p class = "name">
                Oliver
            </p>

            <p class = "mutual-friends">
                2 mutual friends
            </p>

            <button class = "button">
                Add Friend
            </button>
        </div>
    </body>
</html>
