<!DOCTYPE html>

<html>
    <head>
        <title>
            Flex Box Practice- 2
        </title>
        <style>

            div{
                font-family: Arial;
                font-style: bold;
                font-weight: 600;
            }

            .container{
                border-width: 1px;
                border-style: solid;
                border-color: rgb(200,200,200);
                width:300px;
                border-radius: 6px;
                
            }
            .flex-box{
                
                display: flex;
                flex-direction: row;
                justify-content: space-between;
                padding-left: 10px;
                padding-right: 10px;
                padding-top: 10px;
                padding-bottom: 10px;
            
                
            }

            .notification{
                background-color: rgb(41, 45, 245);
                color: white;
                border-radius: 20px;
                padding-left: 12px;
                padding-right: 12px;
                padding-top: 5px;
                padding-bottom: 5px;
            }
        </style>
    </head>
    <body>
        <div class = "container">
            <div class = "flex-box">
                    
                        <div>
                            Home
                        </div>
                    
                        <div class="notification">
                            14
                        </div>
            </div>

            <div class = "flex-box">
                    
                        <div>
                            Notifications
                        </div>
                    
                        <div class="notification">
                            3
                        </div>
            </div>

            <div class = "flex-box">
                    
                        <div>
                            Messages
                        </div>
                    
                        <div class="notification">
                            5
                        </div>
            </div>
            
        </div>
    </body>
</html>
